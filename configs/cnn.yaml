model: cnn
data:
  name: fashion_mnist
  root: ./data
  batch_size: 64
  val_batch_size: 512
  test_batch_size: 512
  val_split: 6000
epochs: 150
val_every: 5
early_stop_patience: 30
checkpoint_every_batches: 200
seed_runs:
- 42
- 123
- 2026
optimizers:
  sgd:
    lrs:
    - 0.05
    - 0.01
    - 0.001
  adadelta:
    lrs:
    - 1.0
    - 0.5
    - 0.1
  adagrad:
    lrs:
    - 0.01
    - 0.005
    - 0.001
  rmsprop:
    lrs:
    - 0.005
    - 0.001
    - 0.0005
  adam:
    lrs:
    - 0.002
    - 0.001
    - 0.0005
  adamw:
    lrs:
    - 0.002
    - 0.001
    - 0.0005
  adamax:
    lrs:
    - 0.002
    - 0.001
    - 0.0005
  nadam:
    lrs:
    - 0.002
    - 0.001
    - 0.0005
output_dir: ./outputs
tensorboard_dir: ./outputs/tensorboard
git_backup:
  enabled: true
  repo_url: https://github.com/thanh1912-ut/lab1-nhom8
  branch: main
  every_runs: 1
